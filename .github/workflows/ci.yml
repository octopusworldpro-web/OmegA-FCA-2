name: OmegA-FCA CI

concurrency:
  group: omega-fca-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main, public-package]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
      - run: npm run test:syntax
      - name: Smoke-test package root exports
        run: |
          node -e 'const p=require("./"); for (const k of ["createClient","createGoatBotLogin","createMetaMessengerTransport","verifyWebhookSignature"]) if (typeof p[k] !== "function") throw new Error("Missing export "+k)'
      - name: Verify publishable package contents
        run: npm pack --dry-run --json
