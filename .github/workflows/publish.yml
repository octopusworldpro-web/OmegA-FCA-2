name: Publish OmegA-FCA to GitHub Packages

# Manual-only until the package namespace/owner and GitHub Packages installation
# are aligned. The project publishes to npmjs from publish-npm.yml on version tags.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@nirzon-islam'
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: |
          npm test
          npm run test:syntax
      - name: Publish package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
